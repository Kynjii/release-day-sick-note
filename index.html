<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Krank am Release-Tag von GTA 6? Symptome wählen, Tonfall festlegen und eine E-Mail kopieren, die die Personalabteilung garantiert glaubt.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤒</text></svg>">
<title>Release-Tag-Krankmeldung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: sunset hero band with a striped sun, then a two-column workbench: symptom chart on the left, live email + believability meter on the right. */
:root {
  --bg: #FFE9DF;
  --surface: #FFF8F4;
  --ink: #2A1636;
  --muted: #7A5A72;
  --hot: #C8245A;
  --sea: #0B8793;
  --sun: #FF9F1C;
  --line: #F0C6B8;
  --sky-top: #FF7A59;
  --sky-bottom: #FFC56E;
  --on-hot: #FFFFFF;
  --hero-fg: #2A1636;
  --hero-inverse: #FFFFFF;
  --hero-chip: rgba(255, 255, 255, 0.4);
  --hero-chip-line: rgba(42, 22, 54, 0.28);
  --hero-shadow: rgba(255, 255, 255, 0.45);
  --radius: 4px;
  --radius-sm: 2px;
  --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1030; --surface: #251842; --ink: #FDEFF4; --muted: #B9A3C9;
    --hot: #FF5C8A; --sea: #3FD3D9; --sun: #FFB347; --line: #3E2C61;
    --sky-top: #3B1E6E; --sky-bottom: #C2386E; --on-hot: #1A1030;
    --hero-fg: #FFFFFF; --hero-inverse: #2A1636; --hero-chip: rgba(26, 16, 48, 0.28);
    --hero-chip-line: rgba(255, 255, 255, 0.35); --hero-shadow: rgba(42, 22, 54, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1030; --surface: #251842; --ink: #FDEFF4; --muted: #B9A3C9;
  --hot: #FF5C8A; --sea: #3FD3D9; --sun: #FFB347; --line: #3E2C61;
  --sky-top: #3B1E6E; --sky-bottom: #C2386E; --on-hot: #1A1030;
  --hero-fg: #FFFFFF; --hero-inverse: #2A1636; --hero-chip: rgba(26, 16, 48, 0.28);
  --hero-chip-line: rgba(255, 255, 255, 0.35); --hero-shadow: rgba(42, 22, 54, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.hero {
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  color: var(--hero-fg);
  overflow: hidden;
  position: relative;
}
.topbar {
  padding-block: 16px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.hero-grid {
  padding-block: 20px 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px;
  align-items: end;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.9;
  margin: 0;
  text-wrap: balance;
}
.lang {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: var(--radius);
  background: var(--hero-chip);
  border: 1px solid var(--hero-chip-line);
}
.lang button {
  font: inherit;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--hero-fg);
  background: transparent;
  border: 0;
  border-radius: var(--radius-sm);
  min-width: 48px;
  min-height: 44px;
  padding: 0 14px;
  cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--hero-fg); color: var(--hero-inverse); }
.lang button:focus-visible { outline: 3px solid var(--hero-fg); outline-offset: 2px; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(34px, 7vw, 72px);
  line-height: 0.95;
  margin: 0 0 16px;
  text-wrap: balance;
  overflow-wrap: break-word;
  hyphens: auto;
  text-shadow: 3px 3px 0 var(--hero-shadow);
}
.lede {
  max-width: 52ch;
  margin: 0 0 24px;
  font-size: 17px;
}
.countdown {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 32px;
}
.tick {
  background: var(--hero-chip);
  border: 1px solid var(--hero-chip-line);
  border-radius: var(--radius);
  padding: 8px 14px;
  min-width: 76px;
  text-align: center;
}
.tick b {
  display: block;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 28px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.tick span {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.countdown-note {
  font-family: var(--font-mono);
  font-size: 12px;
  margin: -20px 0 32px;
  opacity: 0.85;
}
.sun {
  width: clamp(140px, 22vw, 240px);
  max-width: 100%;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  aspect-ratio: 2 / 1;
  background:
    repeating-linear-gradient(180deg, transparent 0 14px, var(--sky-bottom) 14px 20px),
    linear-gradient(180deg, #FFE36E, var(--sun));
  align-self: end;
}
.horizon {
  height: 14px;
  background: var(--bg);
  border-radius: var(--radius) var(--radius) 0 0;
}

main .wrap {
  padding-block: 32px 64px;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 32px;
  align-items: start;
}
section { min-width: 0; }
h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 20px;
  letter-spacing: 0.02em;
  margin: 0 0 4px;
}
.hint { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.block { display: grid; gap: 4px; margin-bottom: 32px; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
label.field { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }
input[type="text"] {
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  width: 100%;
}
input[type="text"]:focus-visible { outline: 3px solid var(--sea); outline-offset: 1px; border-color: var(--sea); }

/* Symptom chart: [checkbox] [code over name] [points pill], same three columns at every width */
.chart { display: grid; gap: 8px; }
.sym { position: relative; display: block; cursor: pointer; }
.sym input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sym .row {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  transition: border-color 0.15s, background 0.15s;
}
.sym .box {
  width: 22px;
  height: 22px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  transition: background 0.15s, border-color 0.15s;
}
.sym .box::after {
  content: "";
  width: 6px;
  height: 11px;
  border: solid var(--on-hot);
  border-width: 0 2.5px 2.5px 0;
  transform: translateY(-1px) rotate(45deg);
  opacity: 0;
}
.sym .text { display: grid; gap: 1px; min-width: 0; }
.sym .code { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.sym .name { font-weight: 500; line-height: 1.3; overflow-wrap: break-word; }
.sym .cost {
  justify-self: end;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  background: color-mix(in srgb, var(--line) 55%, transparent);
  padding: 3px 9px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}
.sym:hover .row { border-color: var(--hot); }
.sym input:checked + .row { border-color: var(--hot); background: color-mix(in srgb, var(--hot) 10%, var(--surface)); }
.sym input:checked + .row .box { background: var(--hot); border-color: var(--hot); }
.sym input:checked + .row .box::after { opacity: 1; }
.sym input:checked + .row .code { color: var(--hot); }
.sym input:checked + .row .cost { color: var(--hot); background: color-mix(in srgb, var(--hot) 16%, transparent); }
.sym input:focus-visible + .row { outline: 3px solid var(--sea); outline-offset: 2px; }

/* Segmented choices */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
}
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 3px solid var(--sea); outline-offset: 2px; }

.toggle { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--hot); flex: none; }

/* Output */
.out { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 16px; }
.meter {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.meter-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.meter-num { font-family: var(--font-display); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: var(--radius-sm); background: var(--line); overflow: hidden; margin: 10px 0 8px; }
.bar i { display: block; height: 100%; width: 50%; border-radius: inherit; background: var(--sea); transition: width 0.35s ease, background 0.35s; }
.verdict { margin: 0; font-weight: 500; }

.email {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.email-head {
  display: grid;
  gap: 2px;
  padding: 14px 18px;
  border-bottom: 1.5px dashed var(--line);
  font-size: 14px;
}
.email-head .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.email-head .subj { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.email-body {
  padding: 16px 18px 20px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 15px;
  margin: 0;
  font-family: var(--font-body);
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions button {
  font: inherit;
  font-weight: 700;
  font-size: 15px;
  padding: 11px 18px;
  border-radius: var(--radius);
  border: 2px solid var(--ink);
  cursor: pointer;
  transition: transform 0.12s;
}
.actions button:active { transform: translateY(1px); }
.actions button:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
.actions .btn-primary { background: var(--hot); border-color: var(--hot); color: var(--on-hot); }
.btn-ghost { background: transparent; color: var(--ink); }
.toast { font-family: var(--font-mono); font-size: 13px; color: var(--sea); align-self: center; min-height: 1em; }

.reading .wrap { padding-block: 0 48px; }
.reading h2 { margin-bottom: 16px; }
.news-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}
.news-item {
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 8px;
  height: 100%;
  padding: 16px 18px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
  transition: border-color 0.15s, transform 0.15s;
}
.news-item:hover { border-color: var(--hot); transform: translateY(-2px); }
.news-item:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
.news-item .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hot); }
.news-item .headline { font-weight: 700; line-height: 1.35; overflow-wrap: break-word; }
.news-item .note { color: var(--muted); font-size: 14px; }
.news-item .src { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.news-item .src::after { content: " ↗"; }
.news-status { grid-column: 1 / -1; color: var(--muted); }
.news-status a { color: var(--hot); font-weight: 500; }

footer .wrap { padding-block: 0 40px; color: var(--muted); font-size: 13px; }

@media (max-width: 820px) {
  main .wrap { grid-template-columns: minmax(0, 1fr); }
  .out { position: static; }
}
@media (max-width: 560px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); }
  .sun { width: 160px; justify-self: center; }
  .sym .row { gap: 12px; padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap topbar">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <div class="lang" role="group" id="lang" data-i18n-aria="langLabel"></div>
  </div>
  <div class="wrap hero-grid">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="lede" data-i18n="lede"></p>
      <div class="countdown">
        <div class="tick"><b id="cd-d">0</b><span data-i18n="days"></span></div>
        <div class="tick"><b id="cd-h">0</b><span data-i18n="hours"></span></div>
        <div class="tick"><b id="cd-m">0</b><span data-i18n="minutes"></span></div>
        <div class="tick"><b id="cd-s">0</b><span data-i18n="seconds"></span></div>
      </div>
      <p class="countdown-note" id="cd-note"></p>
    </div>
    <div class="sun" aria-hidden="true"></div>
  </div>
  <div class="horizon"></div>
</header>

<main>
  <div class="wrap">
    <section aria-labelledby="h-form">
      <h2 id="h-form" data-i18n="h1"></h2>
      <p class="hint" data-i18n="hint1"></p>
      <div class="block">
        <div class="fields" id="fields"></div>
      </div>

      <h2 data-i18n="h2"></h2>
      <p class="hint" data-i18n="hint2"></p>
      <div class="block chart" id="chart"></div>

      <h2 data-i18n="h3"></h2>
      <p class="hint" data-i18n="hint3"></p>
      <div class="block seg" id="tone" role="radiogroup" data-i18n-aria="h3"></div>

      <h2 data-i18n="h4"></h2>
      <p class="hint" data-i18n="hint4"></p>
      <div class="block seg" id="ret" role="radiogroup" data-i18n-aria="h4"></div>

      <div class="block">
        <label class="toggle" for="f-ps"><input type="checkbox" id="f-ps"> <span data-i18n="psToggle"></span></label>
      </div>
    </section>

    <section class="out" aria-labelledby="h-out">
      <h2 id="h-out" data-i18n="outHeading" hidden></h2>
      <div class="meter">
        <div class="meter-top">
          <span class="meter-label" data-i18n="believability"></span>
          <span class="meter-num" id="score">0%</span>
        </div>
        <div class="bar"><i id="bar"></i></div>
        <p class="verdict" id="verdict"></p>
      </div>

      <article class="email">
        <div class="email-head">
          <span class="k" data-i18n="subject"></span>
          <span class="subj" id="subject"></span>
        </div>
        <pre class="email-body" id="body"></pre>
      </article>

      <div class="actions">
        <button class="btn-primary" id="copy" type="button" data-i18n="copy"></button>
        <button class="btn-ghost" id="shuffle" type="button" data-i18n="shuffle"></button>
        <span class="toast" id="toast" role="status"></span>
      </div>
    </section>
  </div>
</main>

<section class="reading" aria-labelledby="h-reading">
  <div class="wrap">
    <h2 id="h-reading" data-i18n="readingHeading"></h2>
    <ul class="news-list" id="news-list"></ul>
  </div>
</section>

<footer>
  <div class="wrap" data-i18n="footer"></div>
</footer>

            syms: l => `Konkret habe ich ${l}. Ich habe alles in einer Tabelle dokumentiert, die ich auf Anfrage gern zur Verfügung stelle.`,
            none: "Die Symptome habe ich in einer Tabelle dokumentiert, die ich auf Anfrage gern zur Verfügung stelle.",

  { id: "lazy", cost: 25, text: {

            none: "",
            sign: "ttyl," },
      de: { label: "Minimaler Aufwand",
            subject: () => `krank`,
            open: b => `hey ${b.toLowerCase()}\n\nkrank. komm nicht.`,
            syms: l => `symptome: ${l.toLowerCase()}.`,
            none: "",
            sign: "bis dann" } } },
];

const RETURNS = [
  { id: "tomorrow", cost: 0, text: {
      en: { label: "Tomorrow",              line: "I expect to be back tomorrow." },
      de: { label: "Morgen",                line: "Ich bin voraussichtlich morgen wieder da." } } },
  { id: "monday", cost: 8, text: {
      en: { label: "Next week",             line: "I should be well enough to return early next week." },
      de: { label: "Nächste Woche",         line: "Anfang nächster Woche sollte ich wieder fit sein." } } },
  { id: "story", cost: 30, text: {
      en: { label: "After the main story",  line: "I expect to be back once I finish the main story. Recovery time varies." },
      de: { label: "Nach der Hauptstory",   line: "Ich bin zurück, sobald ich die Hauptstory durchgespielt habe. Die Genesungsdauer kann variieren." } } },
  { id: "hundred", cost: 45, text: {
      en: { label: "At 100% completion",    line: "I'll be back when I reach 100% completion. Please don't give away my desk." },
      de: { label: "Bei 100 % Abschluss",   line: "Ich bin zurück, wenn ich 100 % erreicht habe. Bitte vergebt meinen Schreibtisch nicht." } } },
];

const VERDICTS = [
  { min: 80, text: { en: "HR will never know.",                        de: "Die Personalabteilung wird es nie erfahren." } },
  { min: 60, text: { en: "Your manager raises one eyebrow.",           de: "Deine Führungskraft hebt eine Augenbraue." } },
  { min: 40, text: { en: "Your manager checks your online status.",    de: "Deine Führungskraft prüft deinen Online-Status." } },
  { min: 20, text: { en: "Your manager has also called in sick.",      de: "Deine Führungskraft hat sich auch krankgemeldet." } },
  { min: 0,  text: { en: "Just send a screenshot of the title screen.", de: "Schick einfach einen Screenshot vom Titelbildschirm." } },
];

const PS_COST = 10;
const RELEASE = new Date(2026, 10, 19, 0, 0, 0); // last announced release date, local midnight
const LANG_KEY = "sick-note-lang";
const DEFAULT_LANG = "de"; // shown until the visitor picks a language

const $ = id => document.getElementById(id);
let lang = DEFAULT_LANG;
const t = key => UI[lang][key];
const tx = item => item.text[lang];

function joinList(parts) {
  if (parts.length <= 1) return parts.join("");
  return parts.slice(0, -1).join(", ") + ` ${LANGS[lang].and} ` + parts[parts.length - 1];
}
function picked(name, items) {
  const v = document.querySelector(`input[name="${name}"]:checked`)?.value;
  return items.find(i => i.id === v) || items[0];
}
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// null while loading; afterwards the cleaned list from news.json (empty if it failed to load)
let news = null;

function renderNews() {
  const list = $("news-list");
  if (news === null) {
    list.replaceChildren(el("li", { className: "news-status" }, t("newsLoading")));
    return;
  }
  if (news.length === 0) {
    list.replaceChildren(el("li", { className: "news-status" }, t("newsEmpty"), " ",
      el("a", { href: NEWS_HOME, target: "_blank", rel: "noopener noreferrer" }, t("newsLink"))));
    return;
  }
  const fmt = new Intl.DateTimeFormat(LANGS[lang].locale, { day: "numeric", month: "long", year: "numeric" });
  list.replaceChildren(...news.map(a => el("li", {},
    el("a", { className: "news-item", href: a.url, target: "_blank", rel: "noopener noreferrer" },
      el("time", { className: "tag", dateTime: a.date }, fmt.format(new Date(a.date))),
      el("span", { lang: "de" },
        el("span", { className: "headline" }, a.title), el("br"),
        el("span", { className: "note" }, a.summary)),
      el("span", { className: "src" }, t("source"))))));
}

async function loadNews() {
  try {
    const res = await fetch("news.json", { cache: "no-cache" });
    news = res.ok ? cleanNews(await res.json()) : [];
  } catch (e) {
    news = [];
  }
  renderNews();
}

$("lang").innerHTML = Object.entries(LANGS).map(([code, l]) =>
  `<button type="button" data-lang="${code}" lang="${code}" aria-pressed="false">${l.label}</button>`).join("");

$("fields").innerHTML = FIELDS.map(f => `
  <label class="field" for="f-${f.id}"><span data-field="${f.id}"></span>
    <input type="text" id="f-${f.id}" autocomplete="off">
  </label>`).join("");

$("chart").innerHTML = SYMPTOMS.map(s => `
  <label class="sym" for="s-${s.id}">
    <input type="checkbox" id="s-${s.id}" value="${s.id}">
    <span class="row">
      <span class="box" aria-hidden="true"></span>
      <span class="text"><span class="code">${s.code}</span><span class="name" data-sym="${s.id}"></span></span>
      <span class="cost">−${s.cost}</span>
    </span>
  </label>`).join("");

function buildSeg(el, name, items) {
  el.innerHTML = items.map((it, i) => `
    <label for="${name}-${it.id}">
      <input type="radio" name="${name}" id="${name}-${it.id}" value="${it.id}" ${i === 0 ? "checked" : ""}>
      <span data-seg="${name}-${it.id}"></span>
    </label>`).join("");
}
buildSeg($("tone"), "tone", TONES);
buildSeg($("ret"), "ret", RETURNS);

// Example starting state
FIELDS.forEach(f => { $("f-" + f.id).value = f.text[DEFAULT_LANG].example; });
["fever", "thumb", "light"].forEach(id => { $("s-" + id).checked = true; });

function setLang(next) {
  const prev = lang;
  lang = Object.hasOwn(LANGS, next) ? next : DEFAULT_LANG;
  document.documentElement.lang = lang;
  document.title = t("docTitle");

  // Swap example values only where the visitor hasn't typed their own
  FIELDS.forEach(f => {
    const input = $("f-" + f.id);
    if (input.value === f.text[prev].example) input.value = f.text[lang].example;
  });

  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  document.querySelectorAll("[data-field]").forEach(el => { el.textContent = tx(FIELDS.find(f => f.id === el.dataset.field)).label; });
  document.querySelectorAll("[data-sym]").forEach(el => { el.textContent = tx(SYMPTOMS.find(s => s.id === el.dataset.sym)).label; });
  TONES.forEach(it => { document.querySelector(`[data-seg="tone-${it.id}"]`).textContent = tx(it).label; });
  RETURNS.forEach(it => { document.querySelector(`[data-seg="ret-${it.id}"]`).textContent = tx(it).label; });
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderNews();

  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  tick();
  render();
}

$("lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (b && b.dataset.lang !== lang) setLang(b.dataset.lang);
});

function render() {
  const name = $("f-name").value.trim() || t("fallbackName");
  const boss = $("f-boss").value.trim() || t("fallbackBoss");
  const cover = $("f-cover").value.trim();
  const syms = SYMPTOMS.filter(s => $("s-" + s.id).checked);
  const tone = picked("tone", TONES);
  const ret = picked("ret", RETURNS);
  const ps = $("f-ps").checked;
  const T = tx(tone);

  const parts = [T.open(boss)];
  const symLine = syms.length ? T.syms(joinList(syms.map(s => tx(s).line))) : T.none;
  if (symLine) parts.push(symLine);
  if (cover) parts.push(t("cover")(cover));
  parts.push(tx(ret).line);
  parts.push(`${T.sign}\n${name}`);
  if (ps) parts.push(t("ps"));

  $("subject").textContent = T.subject(name);
  $("body").textContent = parts.join("\n\n");

  const cost = syms.reduce((a, s) => a + s.cost, 0) + tone.cost + ret.cost + (ps ? PS_COST : 0);
  const score = Math.max(0, Math.min(100, 100 - cost));
  $("score").textContent = score + "%";
  $("bar").style.width = Math.max(score, 3) + "%";
  $("bar").style.background = score >= 60 ? "var(--sea)" : score >= 30 ? "var(--sun)" : "var(--hot)";
  $("verdict").textContent = VERDICTS.find(v => score >= v.min).text[lang];
}

document.querySelector("main").addEventListener("input", render);
document.querySelector("main").addEventListener("change", render);

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").textContent = ""; }, 2400);
}

$("copy").addEventListener("click", () => {
  const text = `${t("subject")}: ${$("subject").textContent}\n\n${$("body").textContent}`;
  const fallback = () => {
    const range = document.createRange();
    range.selectNodeContents($("body"));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast(t("selected"));
  };
  try {
    navigator.clipboard.writeText(text).then(() => toast(t("copied")), fallback);
  } catch (e) { fallback(); }
});

$("shuffle").addEventListener("click", () => {
  SYMPTOMS.forEach(s => { $("s-" + s.id).checked = Math.random() < 0.4; });
  $("tone-" + TONES[Math.floor(Math.random() * TONES.length)].id).checked = true;
  $("ret-" + RETURNS[Math.floor(Math.random() * RETURNS.length)].id).checked = true;
  $("f-ps").checked = Math.random() < 0.5;
  render();
  toast(t("shuffled"));
});

function tick() {
  const ms = RELEASE - new Date();
  if (ms <= 0) {
    ["cd-d", "cd-h", "cd-m", "cd-s"].forEach(id => { $(id).textContent = "0"; });
    $("cd-note").textContent = t("released");
    return;
  }
  const s = Math.floor(ms / 1000);
  $("cd-d").textContent = Math.floor(s / 86400);
  $("cd-h").textContent = String(Math.floor(s / 3600) % 24).padStart(2, "0");
  $("cd-m").textContent = String(Math.floor(s / 60) % 60).padStart(2, "0");
  $("cd-s").textContent = String(s % 60).padStart(2, "0");
  const date = RELEASE.toLocaleDateString(LANGS[lang].locale, { day: "numeric", month: "short", year: "numeric" });
  $("cd-note").textContent = t("countdown")(date);
}

let saved = null;
try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
setLang(saved);
loadNews();
setInterval(tick, 1000);
</script>
