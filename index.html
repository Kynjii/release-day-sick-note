<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" data-i18n-content="metaDescription">
  <title data-i18n="docTitle"></title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <header class="hero">
    <div class="wrap topbar">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <div class="lang" id="lang" role="group" data-i18n-aria="langLabel"><!-- render:langs --></div>
    </div>
    <div class="wrap hero-grid">
      <div>
        <h1 data-i18n="title"></h1>
        <p class="lede" data-i18n="lede"></p>
        <div class="countdown">
          <div class="tick"><b id="cd-d">–</b><span data-i18n="days"></span></div>
          <div class="tick"><b id="cd-h">–</b><span data-i18n="hours"></span></div>
          <div class="tick"><b id="cd-m">–</b><span data-i18n="minutes"></span></div>
          <div class="tick"><b id="cd-s">–</b><span data-i18n="seconds"></span></div>
        </div>
        <p class="countdown-note" id="cd-note"><!-- render:countdownNote --></p>
      </div>
      <div class="sun" aria-hidden="true"></div>
    </div>
    <div class="horizon"></div>
  </header>

  <main>
    <div class="wrap workbench">
      <form id="note" class="steps" autocomplete="off">
        <fieldset class="step" aria-describedby="hint1">
          <legend data-i18n="step1"></legend>
          <p class="hint" id="hint1" data-i18n="hint1"></p>
          <div class="fields"><!-- render:fields --></div>
        </fieldset>

        <fieldset class="step" aria-describedby="hint2">
          <legend data-i18n="step2"></legend>
          <p class="hint" id="hint2" data-i18n="hint2"></p>
          <div class="chart"><!-- render:symptoms --></div>
        </fieldset>

        <fieldset class="step" aria-describedby="hint3">
          <legend data-i18n="step3"></legend>
          <p class="hint" id="hint3" data-i18n="hint3"></p>
          <div class="seg"><!-- render:tones --></div>
        </fieldset>

        <fieldset class="step" aria-describedby="hint4">
          <legend data-i18n="step4"></legend>
          <p class="hint" id="hint4" data-i18n="hint4"></p>
          <div class="seg"><!-- render:returns --></div>
        </fieldset>

        <label class="toggle" for="f-ps"><input type="checkbox" id="f-ps" name="ps"><span data-i18n="psToggle"></span></label>
      </form>

      <section class="out" aria-labelledby="h-out">
        <h2 id="h-out" class="visually-hidden" data-i18n="outHeading"></h2>
        <div class="meter"><!-- render:meter --></div>
        <article class="email">
          <div class="email-head">
            <span class="k" data-i18n="subject"></span>
            <span class="subj" id="subject"><!-- render:subject --></span>
          </div>
          <pre class="email-body" id="body"><!-- render:body --></pre>
        </article>
        <div class="actions">
          <button class="btn-primary" id="copy" type="button" data-i18n="copy"></button>
          <button class="btn-ghost" id="shuffle" type="button" data-i18n="shuffle"></button>
          <span class="toast" id="toast" role="status"></span>
        </div>
      </section>
    </div>
  </main>

  <section class="reading" aria-labelledby="h-reading">
    <div class="wrap">
      <div class="reading-head">
        <h2 id="h-reading" data-i18n="readingHeading"></h2>
        <div class="tabs" id="news-source" role="radiogroup" data-i18n-aria="sourceLabel"><!-- render:sources --></div>
      </div>
      <ul class="news-list" id="news-list"><li class="news-status" data-i18n="newsLoading"></li></ul>
    </div>
  </section>

  <footer>
    <div class="wrap" data-i18n="footer"></div>
  </footer>
</body>
</html>
